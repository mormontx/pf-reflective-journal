<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physics Monster • PF Reflective Teaching Journal</title>
  
  <!-- Fonts: Space Grotesk (Sci-Fi / Modern), JetBrains Mono (Code/Math), Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- KaTeX for Physics Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  
  <!-- Marked.js for Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.2/marked.min.js"></script>
  
  <link rel="stylesheet" href="styles.css">
</head>
<body class="monster-theme">
  <!-- Cyber Background Grid Overlay -->
  <div class="cyber-grid-overlay"></div>

  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-container">
          <div class="monster-badge">
            <span class="monster-icon">👾</span>
          </div>
          <div>
            <div class="cyber-tagline">PHYSICS MONSTER LAB</div>
            <h1 class="brand-title">Reflective<span class="neon-pink">PF</span></h1>
          </div>
        </div>
        
        <div class="author-terminal">
          <div class="terminal-status"><span class="status-dot"></span> LIVE SYSTEM</div>
          <a href="https://github.com/mormontx" target="_blank" rel="noopener noreferrer" class="author-handle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            Tugcan Yildirim (@mormontx)
          </a>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div class="sidebar-actions">
        <button id="btn-new-entry" class="btn btn-toxic-green btn-block">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          + NEW JOURNAL ENTRY
        </button>
        <button id="btn-new-design" class="btn btn-pink-outline btn-block">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
          + NEW PF LESSON DESIGN
        </button>
      </div>

      <!-- Search Input -->
      <div class="search-box">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" placeholder="Search concepts, topics, tags...">
      </div>

      <!-- Navigation & Document List -->
      <nav class="sidebar-nav">
        <div class="nav-section-title">CHANNELS</div>
        <ul class="nav-filter-list">
          <li><button class="filter-btn active" data-filter="all">All Modules (<span id="count-all">0</span>)</button></li>
          <li><button class="filter-btn" data-filter="lesson-design">📐 PF Lesson Blueprints (<span id="count-lessons">0</span>)</button></li>
          <li><button class="filter-btn" data-filter="journal-entry">📝 Reflective Journals (<span id="count-journals">0</span>)</button></li>
        </ul>

        <div class="nav-section-title">TAG MATRIX</div>
        <div id="tag-cloud" class="tag-cloud">
          <!-- Populated by JS -->
        </div>

        <div class="nav-section-title">DOCUMENTS INDEX</div>
        <div id="document-list" class="document-list">
          <!-- Populated by JS -->
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="footer-buttons">
          <button id="btn-export-backup" class="btn btn-ghost-sm" title="Backup all entries as JSON">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Backup
          </button>
          <button id="btn-import-backup" class="btn btn-ghost-sm" title="Import backup JSON">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> Import
          </button>
          <button id="btn-reset-defaults" class="btn btn-ghost-sm" title="Restore sample lessons">
            ↺ Reset
          </button>
          <input type="file" id="import-file-input" accept=".json" style="display: none;">
        </div>
      </div>
    </aside>

    <!-- Main Content Reader / Viewer -->
    <main class="main-content">
      <header class="content-header">
        <div class="header-breadcrumbs">
          <span id="doc-type-badge" class="cyber-badge badge-pink">PF Lesson Design</span>
          <span class="breadcrumb-separator">//</span>
          <span id="doc-meta-info" class="doc-meta-info">EDEXCEL IGCSE • TERM 1</span>
        </div>
        <div class="header-tools">
          <button id="btn-edit-current" class="btn btn-edit-neon" title="Edit this document directly">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            EDIT CONTENT
          </button>
          <button id="btn-download-active-md" class="btn btn-cyber-secondary" title="Download as .md file">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            .MD
          </button>
          <button id="btn-copy-markdown" class="btn btn-cyber-secondary" title="Copy Markdown to Clipboard">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            COPY
          </button>
          <button id="btn-delete-current" class="btn btn-danger-icon" title="Delete document">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        </div>
      </header>

      <!-- Active Article Content -->
      <article id="article-viewer" class="article-viewer monster-prose">
        <!-- Markdown parsed here -->
      </article>
    </main>
  </div>

  <!-- Dynamic Modal / Live Editor -->
  <div id="modal-editor" class="modal-overlay hidden">
    <div class="modal-card monster-modal">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <div class="modal-cyber-tag" id="editor-action-tag">EDITING ENTRY</div>
          <h2 class="modal-title" id="editor-modal-title">Edit Document</h2>
        </div>
        <button id="btn-close-modal" class="modal-close-btn">&times;</button>
      </div>

      <div class="modal-body">
        <form id="form-editor">
          <input type="hidden" id="edit-doc-id">
          
          <div class="form-grid">
            <div class="form-group span-2">
              <label for="edit-title">TITLE / TOPIC</label>
              <input type="text" id="edit-title" placeholder="e.g. Y11 Forces: Overcoming the Inertia Dilemma" required>
            </div>

            <div class="form-group">
              <label for="edit-type">DOCUMENT TYPE</label>
              <select id="edit-type">
                <option value="journal-entry">Reflective Teaching Journal</option>
                <option value="lesson-design">Productive Failure Lesson Blueprint</option>
              </select>
            </div>

            <div class="form-group">
              <label for="edit-course">COURSE / COHORT</label>
              <input type="text" id="edit-course" placeholder="e.g. Edexcel IGCSE Y11, IB DP Y12" required>
            </div>

            <div class="form-group">
              <label for="edit-date">DATE</label>
              <input type="date" id="edit-date" required>
            </div>

            <div class="form-group">
              <label for="edit-tags">TAGS (COMMA SEPARATED)</label>
              <input type="text" id="edit-tags" placeholder="#ProductiveFailure, #Forces, #ReflectionInAction">
            </div>
          </div>

          <!-- Quick Template Bar -->
          <div class="editor-quick-bar">
            <span class="quick-bar-label">INSERT SNIPPETS:</span>
            <button type="button" class="snippet-btn" id="snip-schon">⚡ Schön Reflection Prompts</button>
            <button type="button" class="snippet-btn" id="snip-pf-scaffold">🧪 PF 2-Phase Template</button>
            <button type="button" class="snippet-btn" id="snip-contrast-matrix">📊 Contrast Matrix Table</button>
            <button type="button" class="snippet-btn" id="snip-math">∑ KaTeX Formula</button>
            <button type="button" class="snippet-btn" id="snip-callout">💬 Monster Callout Box</button>
          </div>

          <!-- Editor Area -->
          <div class="form-group">
            <div class="editor-tabs">
              <button type="button" class="editor-tab-btn active" id="tab-write">Write (Markdown & Math)</button>
              <button type="button" class="editor-tab-btn" id="tab-preview">Live Render Preview</button>
            </div>
            
            <div id="write-container">
              <textarea id="edit-content" rows="18" placeholder="Write your lesson design or reflective journal in Markdown. Use $...$ or $$...$$ for KaTeX math formulas..."></textarea>
            </div>

            <div id="preview-container" class="preview-box monster-prose hidden">
              <!-- Live preview rendered here -->
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" id="btn-download-editing-md" class="btn btn-cyber-secondary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              Download .md
            </button>
            <div class="modal-footer-spacer"></div>
            <button type="button" id="btn-cancel-modal" class="btn btn-ghost">Cancel</button>
            <button type="submit" class="btn btn-toxic-green">Save & Update Journal</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
