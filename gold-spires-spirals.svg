<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <!-- Gilded Metallic Gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#d4af37" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#ffd700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#aa771c" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="gold-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe57f" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="stripe-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.05"/>
      <stop offset="40%" stop-color="#ffd700" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fff275" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ffd700" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Vertical Gold Stripes -->
  <rect x="58" y="0" width="4" height="360" fill="url(#stripe-grad)"/>
  <line x1="60" y1="0" x2="60" y2="360" stroke="url(#gold-grad)" stroke-width="0.75" stroke-opacity="0.4"/>
  
  <rect x="178" y="0" width="4" height="360" fill="url(#stripe-grad)"/>
  <line x1="180" y1="0" x2="180" y2="360" stroke="url(#gold-grad)" stroke-width="1.2" stroke-opacity="0.55"/>
  <line x1="176" y1="0" x2="176" y2="360" stroke="url(#gold-grad)" stroke-width="0.5" stroke-dasharray="3,3" stroke-opacity="0.4"/>
  <line x1="184" y1="0" x2="184" y2="360" stroke="url(#gold-grad)" stroke-width="0.5" stroke-dasharray="3,3" stroke-opacity="0.4"/>

  <rect x="298" y="0" width="4" height="360" fill="url(#stripe-grad)"/>
  <line x1="300" y1="0" x2="300" y2="360" stroke="url(#gold-grad)" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Celestial Spires (Gothic & Geometric Architectural Needles) -->
  <!-- Spire 1 (Center-Left) -->
  <g transform="translate(60, 0)" opacity="0.4">
    <!-- Spire shaft -->
    <path d="M-6,360 L0,110 L6,360 Z" fill="none" stroke="url(#gold-grad)" stroke-width="0.8"/>
    <!-- Spire needle tip & finial -->
    <line x1="0" y1="110" x2="0" y2="65" stroke="url(#gold-grad)" stroke-width="1.2"/>
    <circle cx="0" cy="65" r="2.5" fill="url(#gold-grad)"/>
    <line x1="0" y1="65" x2="0" y2="45" stroke="url(#gold-grad)" stroke-width="0.8"/>
    <!-- Cross struts & chevron arches -->
    <path d="M-5,280 L0,265 L5,280 M-4,210 L0,195 L4,210 M-3,150 L0,140 L3,150" fill="none" stroke="url(#gold-grad)" stroke-width="0.75"/>
  </g>

  <!-- Spire 2 (Center-Right, Inverted / Counter-Spire) -->
  <g transform="translate(300, 0)" opacity="0.35">
    <path d="M-5,0 L0,230 L5,0 Z" fill="none" stroke="url(#gold-grad)" stroke-width="0.8"/>
    <line x1="0" y1="230" x2="0" y2="280" stroke="url(#gold-grad)" stroke-width="1.2"/>
    <circle cx="0" cy="280" r="2.5" fill="url(#gold-grad)"/>
    <path d="M-4,80 L0,95 L4,80 M-3,150 L0,165 L3,150" fill="none" stroke="url(#gold-grad)" stroke-width="0.75"/>
  </g>

  <!-- Grand Central Architectural Spire -->
  <g transform="translate(180, 0)" opacity="0.5">
    <path d="M-10,360 L0,70 L10,360 Z" fill="none" stroke="url(#gold-grad)" stroke-width="1"/>
    <!-- Gothic Lancet Window Inset -->
    <path d="M-3,310 C-3,290 3,290 3,310 L3,345 L-3,345 Z" fill="none" stroke="url(#gold-grad)" stroke-width="0.75"/>
    <path d="M-2,230 C-2,215 2,215 2,230 L2,260 L-2,260 Z" fill="none" stroke="url(#gold-grad)" stroke-width="0.75"/>
    <!-- Grand Spire Crown -->
    <polygon points="0,35 -4,55 4,55" fill="url(#gold-grad)"/>
    <line x1="0" y1="70" x2="0" y2="20" stroke="url(#gold-grad)" stroke-width="1.4"/>
    <circle cx="0" cy="20" r="3" fill="#ffd700"/>
    <line x1="0" y1="20" x2="0" y2="5" stroke="url(#gold-grad)" stroke-width="0.9"/>
  </g>

  <!-- Intricate Golden Spirals (Logarithmic / Fibonacci Coils) -->
  <!-- Spiral 1: Clockwise Expanding Spiral at (180, 180) -->
  <g transform="translate(180, 180)" opacity="0.45">
    <path d="
      M 0,0 
      A 5,5 0 0,1 5,5 
      A 10,10 0 0,1 -5,15 
      A 20,20 0 0,1 -25,-5 
      A 35,35 0 0,1 10,-40 
      A 55,55 0 0,1 65,15 
      A 80,80 0 0,1 -15,95 
      A 110,110 0 0,1 -125,-15
    " fill="none" stroke="url(#gold-grad)" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- Harmonic Golden Spiral Echo -->
    <path d="
      M 0,0 
      A 8,8 0 0,1 8,8 
      A 16,16 0 0,1 -8,24 
      A 32,32 0 0,1 -40,-8 
      A 54,54 0 0,1 14,-62 
      A 82,82 0 0,1 96,20
    " fill="none" stroke="url(#gold-light)" stroke-width="0.6" stroke-dasharray="2,2"/>
    <circle cx="0" cy="0" r="2" fill="#ffd700"/>
  </g>

  <!-- Spiral 2: Counter-Clockwise Spiral at (60, 180) -->
  <g transform="translate(60, 180)" opacity="0.38">
    <path d="
      M 0,0 
      A 4,4 0 0,0 -4,4 
      A 8,8 0 0,0 4,12 
      A 16,16 0 0,0 20,-4 
      A 28,28 0 0,0 -8,-32 
      A 44,44 0 0,0 -52,12 
      A 64,64 0 0,0 12,76
    " fill="none" stroke="url(#gold-grad)" stroke-width="1" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#d4af37"/>
  </g>

  <!-- Spiral 3: Elegant Vortex Spiral at (300, 180) -->
  <g transform="translate(300, 180)" opacity="0.38">
    <path d="
      M 0,0 
      A 4,4 0 0,1 4,4 
      A 8,8 0 0,1 -4,12 
      A 16,16 0 0,1 -20,-4 
      A 28,28 0 0,1 8,-32 
      A 44,44 0 0,1 52,12 
      A 64,64 0 0,1 -12,76
    " fill="none" stroke="url(#gold-grad)" stroke-width="1" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.5" fill="#d4af37"/>
  </g>

  <!-- Corner Spiral Accent (Repeating Boundary) -->
  <g transform="translate(0, 0)" opacity="0.35">
    <path d="M 0,0 A 15,15 0 0,1 15,15 A 30,30 0 0,1 -15,45 A 50,50 0 0,1 -65,-5" fill="none" stroke="url(#gold-grad)" stroke-width="0.9"/>
  </g>
  <g transform="translate(360, 360)" opacity="0.35">
    <path d="M 0,0 A 15,15 0 0,1 -15,-15 A 30,30 0 0,1 15,-45 A 50,50 0 0,1 65,5" fill="none" stroke="url(#gold-grad)" stroke-width="0.9"/>
  </g>
</svg>
